name: Traiter les audits
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: audits
  cancel-in-progress: false

jobs:
  traiter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Modèles Groq disponibles
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: curl -s https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY" | python3 -c "import sys,json;print(sorted(m['id'] for m in json.load(sys.stdin)['data']))"

      # Si rien n'est en attente, on s'arrête en quelques secondes (pas de minutes gaspillées).
      - name: Audit en attente ?
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          n=$(curl -s "$SUPABASE_URL/rest/v1/audits?status=eq.queued&select=id&limit=1" -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" | python3 -c "import sys,json;print(len(json.load(sys.stdin)))")
          echo "pending=$n" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.pending != '0'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-server.txt

      - name: Dépendances système
        if: steps.check.outputs.pending != '0'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libpango-1.0-0 libpangoft2-1.0-0 libgles2 libegl1 libgl1 libglib2.0-0

      - name: Dépendances Python + modèles
        if: steps.check.outputs.pending != '0'
        run: |
          pip install -q -r requirements-server.txt
          sh setup_models.sh

      - name: Traiter
        if: steps.check.outputs.pending != '0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/worker.py
